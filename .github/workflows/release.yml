name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test


      - name: Package both targets
        run: npm run package

      # A tag that does not match the version in package.json would produce a
      # zip labelled one version and a release labelled another.
      - name: Refuse a tag that disagrees with the manifest version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Fail if a packaged zip contains source maps
        run: |
          if unzip -l artifacts/*.zip | grep -q '\.map$'; then
            echo "source maps in a release artifact"
            exit 1
          fi

      # A checksum says the download arrived intact. It says nothing about
      # who built it, so it is published beside an attestation rather than
      # instead of one.
      - name: Checksum the archives
        run: shasum -a 256 artifacts/*.zip > artifacts/SHA256SUMS

      # Signed by GitHub's Sigstore instance, binding each archive to this
      # commit and this workflow run. A verifier needs no trust in this
      # repository's owner: the attestation is checked against GitHub's
      # public transparency log.
      - name: Attest where the archives came from
        uses: actions/attest-build-provenance@v2
        id: attest
        with:
          subject-path: artifacts/*.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          body_path: docs/release-notes-${{ env.VERSION }}.md